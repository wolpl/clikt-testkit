name: Release

on:
  push:
    tags:
      - snapshot
      - v*
  workflow_dispatch:

env:
  ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
  ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}

jobs:
  check-signing-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Check signing config
        uses: gradle/gradle-build-action@v2
        with:
          arguments: checkSigningConfiguration
          cache-read-only: ${{ github.ref != 'refs/tags/snapshot' }}
  test:
    needs: check-signing-config
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ macos-latest, windows-latest ]
        include:
          - os: macos-latest
            TEST_TASK: macosX64Test
          - os: windows-latest
            TEST_TASK: mingwX64Test
    runs-on: ${{matrix.os}}
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Run tests
      uses: gradle/gradle-build-action@v2
      with:
        arguments: ${{matrix.TEST_TASK}}
        cache-read-only: ${{ github.ref != 'refs/tags/snapshot' }}
    - name: Bundle the build report
      if: failure()
      run: find . -type d -name 'reports' | zip -@ -r build-reports.zip
    - name: Upload the build report
      if: failure()
      uses: actions/upload-artifact@master
      with:
        name: error-report
        path: build-reports.zip
  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Run tests
        uses: gradle/gradle-build-action@v2
        with:
          arguments: jvmTest linuxX64Test
          cache-read-only: ${{ github.ref != 'refs/tags/snapshot' }}
      - name: Publish
        uses: gradle/gradle-build-action@v2
        with:
          arguments: publishAllPublicationsToMavenCentralRepository
          cache-read-only: ${{ github.ref != 'refs/tags/snapshot' }}
      - name: Bundle the build report
        if: failure()
        run: find . -type d -name 'reports' | zip -@ -r build-reports.zip
      - name: Upload the build report
        if: failure()
        uses: actions/upload-artifact@master
        with:
          name: error-report
          path: build-reports.zip